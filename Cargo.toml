[package]
name = "herdr-quota"
version = "0.1.3"
edition = "2024"
rust-version = "1.89"
description = "Local Codex subscription quota for the Herdr tab bar"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml_edit = "0.25"
base64 = "0.22"
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }
